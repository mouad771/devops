[project]
name = "gestion-etudiants"
version = "1.0.0"
description = "Plateforme de gestion d'étudiants — mini-projet DevOps (CI/CD)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI utilise Depends() comme valeur par défaut

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
