apiVersion: v1
kind: ConfigMap
metadata:
  name: gestion-etudiants-config
  labels:
    app: gestion-etudiants
data:
  APP_NAME: "Plateforme de gestion d'etudiants"
  ENVIRONMENT: "production"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  ALGORITHM: "HS256"
  # Connexion vers le service PostgreSQL interne au cluster.
  DATABASE_URL: "postgresql+psycopg2://app:app@postgres:5432/gestion_etudiants"
